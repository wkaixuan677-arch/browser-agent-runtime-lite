name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      # GitHub-hosted Ubuntu runners already provide Chromium's system libraries.
      # Avoid apt mirror stalls; only install the Playwright-managed browser binary.
      - run: npx playwright install chromium
      - run: npm run check
      - run: npm run demo
